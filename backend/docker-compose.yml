version: '3.8'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: assey
      POSTGRES_USER: assey
      POSTGRES_PASSWORD: ${DB_PASSWORD:-assey_local_dev}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assey"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn assey_store.wsgi:application
               --bind 0.0.0.0:8000
               --workers 3
               --timeout 60
               --access-logfile -
               --error-logfile -"
    volumes:
      - media_files:/app/media
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DEBUG: "0"
      DATABASE_URL: postgres://assey:${DB_PASSWORD:-assey_local_dev}@db:5432/assey
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  media_files:
