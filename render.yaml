services:
  - type: web
    name: assey-shop-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.vercel.app"
      - key: DATABASE_URL
        fromDatabase:
          name: assey-shop-db
          property: connectionString

databases:
  - name: assey-shop-db
    plan: free
